<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b12"><title>AI Voice Studio | VibeFlow</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#282044 0,transparent 50%),#090b12;color:#f5f7fb;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:680px;margin:auto;padding:24px 18px 50px}.back{color:#c4b5fd;text-decoration:none}.brand{font-weight:800;margin:25px 0 5px}.eyebrow{font-size:11px;letter-spacing:2px;color:#b9a7ff;font-weight:800}h1{font-size:38px;line-height:1.05;margin:8px 0}p{color:#9aa4b7}.panel{margin-top:25px;padding:20px;border:1px solid #292f40;border-radius:20px;background:#141824}label{display:block;font-size:13px;margin:17px 0 8px}textarea,select{width:100%;background:#0c101a;border:1px solid #30384b;border-radius:12px;color:#f5f7fb;padding:13px;font:inherit}textarea{min-height:130px;resize:vertical}select{height:48px}.count{font-size:11px;color:#9aa4b7;text-align:right;margin-top:5px}button{width:100%;border:0;border-radius:13px;padding:15px;margin-top:20px;background:linear-gradient(100deg,#9b83f6,#54cbd5);color:#090b12;font-weight:800;font-size:15px}button:disabled{opacity:.55}audio{width:100%;margin-top:18px}.status{font-size:13px;color:#c4b5fd;margin-top:14px;min-height:20px}.note{font-size:12px;color:#9aa4b7;margin-top:18px}
</style></head><body><main class="wrap"><a class="back" href="index.html">← Back to studio</a><div class="brand">✦ VibeFlow AI</div><div class="eyebrow">VOICE STUDIO</div><h1>Give your words a voice.</h1><p>Turn a short script into spoken audio.</p>
<section class="panel"><label for="script">Your script</label><textarea id="script" maxlength="200" placeholder="Type what you want your voice to say..."></textarea><div class="count"><span id="count">0</span>/200 characters</div><label for="voice">Choose a voice</label><select id="voice"><option value="hannah">Hannah · Warm female</option><option value="autumn">Autumn · Expressive female</option><option value="diana">Diana · Clear female</option><option value="austin">Austin · Confident male</option><option value="daniel">Daniel · Conversational male</option><option value="troy">Troy · Deep male</option></select><button id="generate">Generate voice</button><div class="status" id="status" aria-live="polite"></div><audio id="player" controls hidden></audio><a id="download" hidden download="vibeflow-voice.wav" style="display:block;color:#c4b5fd;margin-top:12px">Download audio</a></section>
<p class="note">This feature uses an English speech model. It does not clone your personal voice. Keep scripts short (up to 200 characters).</p></main>
<script>
const script=document.querySelector("#script"),count=document.querySelector("#count"),button=document.querySelector("#generate"),status=document.querySelector("#status"),player=document.querySelector("#player"),download=document.querySelector("#download");
script.addEventListener("input",()=>count.textContent=script.value.length);
button.addEventListener("click",async()=>{const text=script.value.trim();if(!text){status.textContent="Please enter a script.";return}button.disabled=true;button.textContent="Generating…";status.textContent="Creating your audio…";player.hidden=true;download.hidden=true;try{const response=await fetch("/api/voice",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,voice:document.querySelector("#voice").value})});if(!response.ok){let message="Voice generation failed. Try again.";try{message=(await response.json()).error||message}catch{}throw new Error(message)}const blob=await response.blob();const url=URL.createObjectURL(blob);player.src=url;player.hidden=false;download.href=url;download.hidden=false;status.textContent="Your audio is ready."}catch(error){status.textContent=error.message||"Something went wrong."}finally{button.disabled=false;button.textContent="Generate voice"}});
</script></body></html>
